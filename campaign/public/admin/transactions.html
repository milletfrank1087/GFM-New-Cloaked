<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transactions | HopeRise Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { gfm: { green: '#00b964', 'green-dark': '#02a95c', 'green-light': '#e8f8f0', dark: '#333333', gray: '#767676' } },
          fontFamily: { outfit: ['Inter', 'sans-serif'] }
        }
      }
    }
  </script>
</head>
<body class="font-outfit bg-gray-50 min-h-screen">
  <!-- Mobile Header -->
  <header class="lg:hidden fixed top-0 left-0 right-0 bg-white border-b border-gray-200 z-50 px-4 py-3 flex items-center justify-between">
    <button id="mobile-menu-btn" class="p-2 hover:bg-gray-100 rounded-lg">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <span class="font-bold text-gfm-dark">Transactions</span>
    <button onclick="logout()" class="p-2 hover:bg-gray-100 rounded-lg text-gfm-gray">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
    </button>
  </header>

  <!-- Sidebar -->
  <aside id="sidebar" class="fixed left-0 top-0 h-full w-64 bg-white border-r border-gray-200 z-40 transform -translate-x-full lg:translate-x-0 transition-transform">
    <div class="p-6 border-b border-gray-100">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-gfm-green rounded-full flex items-center justify-center">
          <svg class="w-5 h-5 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        </div>
        <span class="font-bold text-gfm-dark">HopeRise</span>
      </div>
    </div>
    <nav class="p-4 space-y-1">
      <a href="/admin" class="flex items-center gap-3 px-4 py-3 rounded-xl text-gfm-gray hover:bg-gray-100 transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
        Dashboard
      </a>
      <a href="/admin/customers.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-gfm-gray hover:bg-gray-100 transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
        Customers
      </a>
      <a href="/admin/transactions.html" class="flex items-center gap-3 px-4 py-3 rounded-xl bg-gfm-green-light text-gfm-green font-medium">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/></svg>
        Transactions
      </a>
    </nav>
    <div class="absolute bottom-0 left-0 right-0 p-4 border-t border-gray-100">
      <button onclick="logout()" class="flex items-center gap-3 px-4 py-3 rounded-xl text-gfm-gray hover:bg-gray-100 transition-colors w-full">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
        Logout
      </button>
    </div>
  </aside>
  <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-30 hidden lg:hidden" onclick="closeSidebar()"></div>

  <!-- Main Content -->
  <main class="lg:ml-64 pt-16 lg:pt-0 min-h-screen">
    <div class="p-4 lg:p-8">
      <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">
        <h1 class="text-2xl font-bold text-gfm-dark">Transactions</h1>
        <div class="flex gap-2 flex-wrap">
          <select id="status-filter" class="px-4 py-2 border border-gray-200 rounded-xl focus:border-gfm-green focus:outline-none">
            <option value="">All Status</option>
            <option value="completed">Completed</option>
            <option value="pending">Pending</option>
            <option value="refunded">Refunded</option>
          </select>
          <button onclick="exportCSV()" class="px-4 py-2 bg-gfm-green text-white rounded-xl font-medium hover:bg-gfm-green-dark transition-colors">Export</button>
        </div>
      </div>

      <!-- Stats -->
      <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
        <div class="bg-white rounded-xl p-4 shadow-sm text-center">
          <p class="text-2xl font-bold text-gfm-green" id="stat-total">-</p>
          <p class="text-sm text-gfm-gray">Donations</p>
        </div>
        <div class="bg-white rounded-xl p-4 shadow-sm text-center">
          <p class="text-2xl font-bold text-red-500" id="stat-fees">-</p>
          <p class="text-sm text-gfm-gray">Fees</p>
        </div>
        <div class="bg-white rounded-xl p-4 shadow-sm text-center">
          <p class="text-2xl font-bold text-gfm-dark" id="stat-count">0</p>
          <p class="text-sm text-gfm-gray">Transactions</p>
        </div>
        <div class="bg-white rounded-xl p-4 shadow-sm text-center">
          <p class="text-2xl font-bold text-gfm-dark" id="stat-avg">-</p>
          <p class="text-sm text-gfm-gray">Average</p>
        </div>
      </div>
      
      <!-- Desktop Table -->
      <div class="hidden md:block bg-white rounded-2xl shadow-sm overflow-hidden">
        <table class="w-full">
          <thead class="bg-gray-50 border-b border-gray-200">
            <tr>
              <th class="text-left px-6 py-4 text-sm font-semibold text-gfm-dark">Customer</th>
              <th class="text-left px-6 py-4 text-sm font-semibold text-gfm-dark">Amount</th>
              <th class="text-left px-6 py-4 text-sm font-semibold text-gfm-dark">Fee</th>
              <th class="text-left px-6 py-4 text-sm font-semibold text-gfm-dark">Net</th>
              <th class="text-left px-6 py-4 text-sm font-semibold text-gfm-dark">Payment</th>
              <th class="text-left px-6 py-4 text-sm font-semibold text-gfm-dark">Date</th>
              <th class="text-right px-6 py-4 text-sm font-semibold text-gfm-dark">Action</th>
            </tr>
          </thead>
          <tbody id="transactions-table"></tbody>
        </table>
      </div>

      <!-- Mobile Cards -->
      <div class="md:hidden space-y-3" id="transactions-cards"></div>
    </div>
  </main>

  <!-- Transaction Detail Modal -->
  <div id="detail-modal" class="fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-black/50" onclick="closeDetailModal()"></div>
    <div class="absolute inset-4 md:inset-auto md:top-1/2 md:left-1/2 md:-translate-x-1/2 md:-translate-y-1/2 md:w-full md:max-w-2xl bg-white rounded-2xl overflow-hidden max-h-[90vh] flex flex-col">
      <div class="p-6 border-b border-gray-100 flex items-center justify-between">
        <h3 class="text-xl font-bold text-gfm-dark">Transaction Details</h3>
        <button onclick="closeDetailModal()" class="p-2 hover:bg-gray-100 rounded-lg">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="p-6 overflow-y-auto flex-1" id="detail-content">
        <p class="text-gfm-gray">Loading...</p>
      </div>
    </div>
  </div>

  <script>
    fetch('/api/admin/check').then(r => { if (!r.ok) window.location.href = '/admin/login.html'; });
    
    document.getElementById('mobile-menu-btn')?.addEventListener('click', () => {
      document.getElementById('sidebar').classList.toggle('-translate-x-full');
      document.getElementById('sidebar-overlay').classList.toggle('hidden');
    });
    function closeSidebar() {
      document.getElementById('sidebar').classList.add('-translate-x-full');
      document.getElementById('sidebar-overlay').classList.add('hidden');
    }
    function logout() {
      fetch('/api/admin/logout', { method: 'POST' }).then(() => window.location.href = '/admin/login.html');
    }

    let transactions = [];
    let currencyConfig = { symbol: '€', locale: 'en-US', position: 'before' };
    
    async function loadCurrencyConfig() {
      try {
        const res = await fetch('/api/currency/config');
        if (res.ok) currencyConfig = await res.json();
      } catch (e) { console.warn('Currency config fetch failed'); }
    }
    
    function formatCurrency(amount) {
      const formatted = parseFloat(amount || 0).toLocaleString(currencyConfig.locale, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      return currencyConfig.position === 'after' ? formatted + currencyConfig.symbol : currencyConfig.symbol + formatted;
    }

    async function loadTransactions() {
      const res = await fetch('/api/admin/transactions');
      if (!res.ok) return;
      transactions = await res.json();
      renderTransactions(transactions);
      updateStats(transactions);
    }

    function updateStats(data) {
      const total = data.reduce((s, t) => s + t.amount, 0);
      const fees = data.reduce((s, t) => s + (t.paypalFee || 0), 0);
      document.getElementById('stat-total').textContent = formatCurrency(total);
      document.getElementById('stat-fees').textContent = '-' + formatCurrency(fees);
      document.getElementById('stat-count').textContent = data.length;
      document.getElementById('stat-avg').textContent = formatCurrency(data.length ? total / data.length : 0);
    }

    function renderTransactions(data) {
      const tbody = document.getElementById('transactions-table');
      const cards = document.getElementById('transactions-cards');
      
      if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="px-6 py-8 text-center text-gfm-gray">No transactions yet</td></tr>';
        cards.innerHTML = '<p class="text-gfm-gray text-center py-8">No transactions yet</p>';
        return;
      }
      
      tbody.innerHTML = data.map(t => `
        <tr class="border-b border-gray-100 hover:bg-gray-50 cursor-pointer" onclick="showTransactionDetail('${t.id}')">
          <td class="px-6 py-4">
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 rounded-full bg-gradient-to-br ${t.color} flex items-center justify-center text-white text-sm font-bold">${t.initials}</div>
              <div>
                <p class="font-medium text-gfm-dark">${t.name}${t.isAnonymous ? ' <span class="text-xs text-orange-500">(anon)</span>' : ''}</p>
                <p class="text-xs text-gfm-gray">${t.cardBrand ? t.cardBrand + (t.cardLastDigits ? ' ****' + t.cardLastDigits : '') : t.type}${t.donationType === 'monthly' ? ' • <span class="text-blue-500">Monthly</span>' : ''}</p>
              </div>
            </div>
          </td>
          <td class="px-6 py-4 font-bold text-gfm-green">${formatCurrency(t.amount)}${t.currency && t.currency !== 'EUR' ? ' <span class="text-xs px-1.5 py-0.5 bg-blue-100 text-blue-600 rounded font-medium">' + t.currency + '</span>' : ''}</td>
          <td class="px-6 py-4 text-red-500 text-sm">-${formatCurrency(t.paypalFee)}</td>
          <td class="px-6 py-4 font-medium">${formatCurrency(t.netAmount)}</td>
          <td class="px-6 py-4">
            <span class="px-2 py-1 bg-green-100 text-green-700 rounded-full text-xs font-medium">${t.status}</span>
            ${t.vaultId ? '<span class="ml-1 px-2 py-1 bg-purple-100 text-purple-700 rounded-full text-xs font-medium">🔄</span>' : ''}
          </td>
          <td class="px-6 py-4 text-gfm-gray text-sm">${t.date}</td>
          <td class="px-6 py-4 text-right">
            <button class="text-gfm-green hover:text-gfm-green-dark">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
            </button>
          </td>
        </tr>
      `).join('');

      cards.innerHTML = data.map(t => `
        <div class="bg-white rounded-xl p-4 shadow-sm cursor-pointer hover:shadow-md transition-shadow" onclick="showTransactionDetail('${t.id}')">
          <div class="flex items-center justify-between mb-3">
            <div class="flex items-center gap-3">
              <div class="w-12 h-12 rounded-full bg-gradient-to-br ${t.color} flex items-center justify-center text-white font-bold">${t.initials}</div>
              <div>
                <p class="font-bold text-gfm-dark">${t.name}${t.isAnonymous ? ' <span class="text-xs text-orange-500">(anon)</span>' : ''}</p>
                <p class="text-xs text-gfm-gray">${t.cardBrand ? t.cardBrand + (t.cardLastDigits ? ' ****' + t.cardLastDigits : '') : t.type}${t.donationType === 'monthly' ? ' • <span class="text-blue-500">Monthly</span>' : ''}</p>
              </div>
            </div>
            <div class="text-right">
              <p class="text-xl font-bold text-gfm-green">${formatCurrency(t.amount)}${t.currency && t.currency !== 'EUR' ? ' <span class="text-xs px-1.5 py-0.5 bg-blue-100 text-blue-600 rounded font-medium">' + t.currency + '</span>' : ''}</p>
              <p class="text-xs text-red-500">-${formatCurrency(t.paypalFee)} fee</p>
            </div>
          </div>
          <div class="flex items-center justify-between text-sm pt-2 border-t border-gray-100">
            <span class="text-gfm-gray">${t.date}</span>
            <div class="flex gap-1">
              <span class="px-2 py-1 bg-green-100 text-green-700 rounded-full text-xs font-medium">${t.status}</span>
              ${t.vaultId ? '<span class="px-2 py-1 bg-purple-100 text-purple-700 rounded-full text-xs font-medium">🔄 Recurring</span>' : ''}
            </div>
          </div>
        </div>
      `).join('');
    }

    document.getElementById('status-filter').addEventListener('change', (e) => {
      const status = e.target.value;
      const filtered = status ? transactions.filter(t => t.status === status) : transactions;
      renderTransactions(filtered);
      updateStats(filtered);
    });

    async function showTransactionDetail(id) {
      document.getElementById('detail-modal').classList.remove('hidden');
      document.getElementById('detail-content').innerHTML = '<p class="text-gfm-gray">Loading...</p>';
      
      const res = await fetch(`/api/admin/transactions/${id}`);
      if (!res.ok) {
        document.getElementById('detail-content').innerHTML = '<p class="text-red-500">Failed to load details</p>';
        return;
      }
      
      const d = await res.json();
      
      document.getElementById('detail-content').innerHTML = `
        <div class="space-y-6">
          <!-- Donor Info -->
          <div>
            <h4 class="font-semibold text-gfm-dark mb-3 flex items-center gap-2">
              <svg class="w-5 h-5 text-gfm-green" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
              Donor Information
            </h4>
            <div class="bg-gray-50 rounded-xl p-4 grid grid-cols-2 gap-4 text-sm">
              <div><span class="text-gfm-gray">Name:</span> <span class="font-medium">${d.donor?.name || '-'}</span></div>
              <div><span class="text-gfm-gray">Anonymous:</span> <span class="font-medium">${d.donor?.isAnonymous ? 'Yes' : 'No'}</span></div>
              ${d.payer?.email ? `<div class="col-span-2"><span class="text-gfm-gray">Payer Email:</span> <span class="font-medium">${d.payer.email}</span></div>` : ''}
              ${d.payer?.id ? `<div class="col-span-2"><span class="text-gfm-gray">Payer ID:</span> <span class="font-mono text-xs">${d.payer.id}</span></div>` : ''}
              ${d.payer?.country ? `<div><span class="text-gfm-gray">Country:</span> <span class="font-medium">${d.payer.country}</span></div>` : ''}
            </div>
          </div>
          
          <!-- Amount Breakdown -->
          <div>
            <h4 class="font-semibold text-gfm-dark mb-3 flex items-center gap-2">
              <svg class="w-5 h-5 text-gfm-green" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
              Amount Breakdown
            </h4>
            <div class="bg-gray-50 rounded-xl p-4 space-y-2 text-sm">
              <div class="flex justify-between"><span class="text-gfm-gray">Donation:</span> <span class="font-medium">${formatCurrency(d.amounts?.donation)}</span></div>
              <div class="flex justify-between"><span class="text-gfm-gray">Tip:</span> <span class="font-medium text-blue-600">+${formatCurrency(d.amounts?.tip)}</span></div>
              <div class="flex justify-between border-t border-gray-200 pt-2"><span class="text-gfm-gray">Gross Total:</span> <span class="font-bold">${formatCurrency(d.amounts?.total)}</span></div>
              <div class="flex justify-between"><span class="text-gfm-gray">Processing Fee:</span> <span class="font-medium text-red-500">-${formatCurrency(d.amounts?.paypalFee)}</span></div>
              <div class="flex justify-between border-t border-gray-200 pt-2"><span class="text-gfm-gray">Net Received:</span> <span class="font-bold text-gfm-green">${formatCurrency(d.amounts?.net)}</span></div>
            </div>
          </div>
          
          <!-- Card Details -->
          ${d.card?.holderName || d.card?.lastDigits ? `
          <div>
            <h4 class="font-semibold text-gfm-dark mb-3 flex items-center gap-2">
              <svg class="w-5 h-5 text-gfm-green" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/></svg>
              Card Details
            </h4>
            <div class="bg-gray-50 rounded-xl p-4 grid grid-cols-2 gap-4 text-sm">
              ${d.card?.holderName ? `<div class="col-span-2"><span class="text-gfm-gray">Cardholder:</span> <span class="font-medium">${d.card.holderName}</span></div>` : ''}
              ${d.card?.brand ? `<div><span class="text-gfm-gray">Brand:</span> <span class="font-medium">${d.card.brand}</span></div>` : ''}
              ${d.card?.lastDigits ? `<div><span class="text-gfm-gray">Last 4:</span> <span class="font-mono">****${d.card.lastDigits}</span></div>` : ''}
              ${d.card?.expiry ? `<div><span class="text-gfm-gray">Expiry:</span> <span class="font-medium">${d.card.expiry}</span></div>` : ''}
              ${d.card?.type ? `<div><span class="text-gfm-gray">Type:</span> <span class="font-medium">${d.card.type}</span></div>` : ''}
            </div>
          </div>
          ` : ''}
          
          <!-- Processing -->
          <div>
            <h4 class="font-semibold text-gfm-dark mb-3 flex items-center gap-2">
              <svg class="w-5 h-5 text-gfm-green" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
              Processing
            </h4>
            <div class="bg-gray-50 rounded-xl p-4 grid grid-cols-2 gap-4 text-sm">
              <div><span class="text-gfm-gray">Status:</span> <span class="px-2 py-0.5 bg-green-100 text-green-700 rounded-full text-xs font-medium">${d.status || 'completed'}</span></div>
              <div><span class="text-gfm-gray">Source:</span> <span class="font-medium">${d.processing?.source || '-'}</span></div>
              ${d.processing?.processorCode ? `<div><span class="text-gfm-gray">Response:</span> <span class="font-mono">${d.processing.processorCode}</span></div>` : ''}
              ${d.processing?.cvvCode ? `<div><span class="text-gfm-gray">CVV:</span> <span class="font-mono">${d.processing.cvvCode}</span></div>` : ''}
              ${d.processing?.sellerProtection ? `<div class="col-span-2"><span class="text-gfm-gray">Protection:</span> <span class="font-medium">${d.processing.sellerProtection}</span></div>` : ''}
            </div>
          </div>
          
          <!-- IDs -->
          <div>
            <h4 class="font-semibold text-gfm-dark mb-3">Transaction IDs</h4>
            <div class="bg-gray-50 rounded-xl p-4 space-y-2 text-sm">
              <div><span class="text-gfm-gray">Internal:</span> <span class="font-mono text-xs break-all">${d.id || '-'}</span></div>
              <div><span class="text-gfm-gray">Order:</span> <span class="font-mono text-xs break-all">${d.orderId || '-'}</span></div>
              <div><span class="text-gfm-gray">Capture:</span> <span class="font-mono text-xs break-all">${d.captureId || '-'}</span></div>
              ${d.processing?.networkTxnId ? `<div><span class="text-gfm-gray">Network:</span> <span class="font-mono text-xs break-all">${d.processing.networkTxnId}</span></div>` : ''}
            </div>
          </div>
          
          <!-- Metadata -->
          <div>
            <h4 class="font-semibold text-gfm-dark mb-3">Metadata</h4>
            <div class="bg-gray-50 rounded-xl p-4 space-y-2 text-sm">
              <div><span class="text-gfm-gray">Campaign:</span> <span class="font-medium">${d.campaign || '-'}</span></div>
              <div><span class="text-gfm-gray">Type:</span> <span class="font-medium">${d.metadata?.donationType || '-'}</span></div>
              <div><span class="text-gfm-gray">IP:</span> <span class="font-mono text-xs">${d.metadata?.ipAddress || '-'}</span></div>
              <div><span class="text-gfm-gray">Created:</span> <span class="font-medium">${d.timestamps?.created ? new Date(d.timestamps.created).toLocaleString() : '-'}</span></div>
            </div>
          </div>
        </div>
      `;
    }
    
    function closeDetailModal() {
      document.getElementById('detail-modal').classList.add('hidden');
    }
    
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeDetailModal();
    });

    function exportCSV() {
      const headers = ['ID', 'Capture ID', 'Customer', 'Amount', 'Tip', 'Total', 'Fee', 'Net', 'Card', 'Status', 'Date'];
      const rows = transactions.map(t => [
        t.id,
        t.captureId || '',
        t.name,
        t.amount,
        t.tipAmount || 0,
        t.totalAmount,
        t.paypalFee || 0,
        t.netAmount,
        t.cardBrand ? `${t.cardBrand} ****${t.cardLastDigits || ''}` : t.type,
        t.status,
        t.rawDate || t.date
      ]);
      const csv = [headers, ...rows].map(r => r.map(c => `"${c}"`).join(',')).join('\n');
      const blob = new Blob([csv], { type: 'text/csv' });
      const a = document.createElement('a'); 
      a.href = URL.createObjectURL(blob); 
      a.download = `transactions-${new Date().toISOString().split('T')[0]}.csv`; 
      a.click();
    }

    loadCurrencyConfig().then(() => loadTransactions());
  </script>
</body>
</html>
