<div class="lg:sticky lg:top-28">
  <!-- Progress Card -->
  <div class="bg-white rounded-2xl shadow-xl shadow-gray-200/50 p-6 mb-4" data-aos="fade-left">
    <!-- Title (Desktop) -->
    <h1 class="hidden lg:block text-xl font-bold mb-4 leading-tight" data-campaign="title"><span class="inline-block bg-gray-200 rounded animate-pulse h-6 w-3/4"></span></h1>
    
    <!-- Progress -->
    <div class="mb-4">
      <div class="flex justify-between items-end mb-2">
        <div data-stat="raised">
          <span class="text-3xl font-bold text-gfm-green counter" data-target="0"><span data-currency-symbol>€</span>—</span>
          <span class="text-gfm-gray text-sm"> <span data-i18n="common.sidebar.raised">συγκεντρώθηκαν</span></span>
        </div>
        <span class="text-gfm-gray text-sm"><span data-i18n="common.sidebar.of">από</span> <span data-campaign="goal">—</span> <span data-i18n="common.sidebar.goal">στόχο</span></span>
      </div>
      <div class="h-2 bg-gray-100 rounded-full overflow-hidden">
        <div class="h-full bg-gradient-to-r from-gfm-green to-emerald-400 rounded-full progress-bar" style="width: 0%" data-target="0"></div>
      </div>
    </div>
    
    <!-- Stats -->
    <div class="flex items-center gap-4 mb-6 text-sm">
      <div class="flex items-center gap-1.5" data-stat="donors">
        <svg class="w-4 h-4 text-gfm-gray" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/>
        </svg>
        <span class="text-gfm-dark font-medium"><span class="counter" data-target="0">0</span> <span data-i18n="common.sidebar.donors">donors</span></span>
      </div>
      <div class="w-px h-4 bg-gray-200"></div>
      <div class="flex items-center gap-1.5" data-stat="days">
        <svg class="w-4 h-4 text-gfm-gray" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        <span class="text-gfm-dark font-medium"><span class="counter" data-target="0">0</span> <span data-i18n="common.sidebar.daysLeft">days left</span></span>
      </div>
    </div>
    
    <!-- Donate Buttons -->
    <div class="space-y-3 mb-6" id="donate">
      <a href="#donation-modal" class="group block w-full bg-gfm-green hover:bg-gfm-green-dark text-white py-4 rounded-xl font-bold text-lg text-center transition-all duration-300 shadow-lg shadow-gfm-green/25 hover:shadow-xl hover:shadow-gfm-green/30 hover:scale-[1.02] active:scale-[0.98] relative overflow-hidden" id="open-donate-modal">
        <span class="relative z-10 flex items-center justify-center gap-2">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12z"/></svg>
          <span data-i18n="common.nav.donateNow">Donate Now</span>
        </span>
        <span class="absolute inset-0 bg-white/10 translate-y-full group-hover:translate-y-0 transition-transform duration-300"></span>
      </a>
      <button class="w-full bg-white border-2 border-gray-200 hover:border-gfm-green text-gfm-dark py-3 rounded-xl font-semibold transition-all duration-300 flex items-center justify-center gap-2 text-sm">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"/>
        </svg>
        <span data-i18n="common.sidebar.share">Share</span>
      </button>
    </div>
    
    <!-- Milestones -->
    <div class="mb-0">
      <h4 class="font-semibold text-sm text-gfm-dark mb-3" data-i18n="common.sidebar.milestones">Milestones</h4>
      <div class="space-y-3" id="milestones-list">
      </div>
    </div>
    
    <!-- Recent Donation -->
    <div class="mt-6 pt-6 border-t border-gray-100">
      <p class="text-xs text-gfm-gray uppercase tracking-wide mb-3" data-i18n="common.sidebar.recentDonation">Recent Donation</p>
      <div class="flex items-center gap-3 animate-pulse-subtle" id="recent-donation">
        <div class="w-10 h-10 rounded-full bg-gradient-to-br from-gray-300 to-gray-400 flex items-center justify-center text-white text-sm font-bold">...</div>
        <div class="flex-1">
          <p class="font-medium text-sm text-gray-400" data-i18n="common.misc.loading">Φόρτωση...</p>
          <p class="text-xs text-gfm-gray">—</p>
        </div>
      </div>
    </div>
  </div>
  
  <!-- Organizer Card -->
  <div class="bg-white rounded-2xl shadow-lg shadow-gray-200/30 p-6" data-aos="fade-left" data-aos-delay="100">
    <div class="flex items-center gap-4 mb-4">
      <div class="w-14 h-14 rounded-full bg-gradient-to-br from-gfm-green to-emerald-500 flex items-center justify-center text-white font-bold text-lg" data-campaign="organizer-initials">...</div>
      <div>
        <p class="font-bold text-gfm-dark" data-campaign="organizer-name">—</p>
        <p class="text-sm text-gfm-gray"><span data-i18n="common.organizer.title">Διοργανωτής</span> • <span data-campaign="organizer-location">—</span></p>
      </div>
    </div>
    <div class="flex items-center gap-4 text-sm">
      <div class="flex items-center gap-1.5 text-gfm-gray">
        <svg class="w-4 h-4 text-gfm-green" fill="currentColor" viewBox="0 0 24 24">
          <path d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
        </svg>
        <span data-i18n="common.organizer.verified">Verified</span>
      </div>
      <div class="flex items-center gap-1.5 text-gfm-gray">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
        </svg>
        <span><span data-i18n="common.organizer.created">Created</span> <span data-campaign="organizer-date">Dec 21, 2025</span></span>
      </div>
    </div>
  </div>
  
  <!-- Trust Badges -->
  <div class="mt-4 flex flex-wrap items-center justify-center gap-4 text-xs text-gfm-gray">
    <div class="flex items-center gap-1.5">
      <svg class="w-4 h-4 text-gfm-green" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
      </svg>
      <span data-i18n="common.trust.secure">Secure</span>
    </div>
    <div class="flex items-center gap-1.5">
      <svg class="w-4 h-4 text-gfm-green" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
      </svg>
      <span data-i18n="common.trust.protected">Protected</span>
    </div>
    <div class="flex items-center gap-1.5">
      <svg class="w-4 h-4 text-gfm-green" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
      </svg>
      <span data-i18n="common.trust.transparent">Transparent</span>
    </div>
  </div>
</div>
